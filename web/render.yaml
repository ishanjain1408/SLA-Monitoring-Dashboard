services:
  - type: web
    name: sla-monitoring-dashboard
    env: node
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DB_PATH
        value: /data/earthre_sla.db
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
